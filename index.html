<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WHITEFALL — Freedom To Fall. Limited-run streetwear and luxury pieces. FW26 coming soon." />
    <!-- Share card. YOUR-SITE-URL is replaced at build time with the real
         domain (see vite.config.js) — no manual edit needed. -->
    <meta property="og:site_name" content="WHITEFALL" />
    <meta property="og:title" content="WHITEFALL — Freedom To Fall" />
    <meta property="og:description" content="FW26 is coming. Release dates on Instagram, @whitefall26." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://YOUR-SITE-URL/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WHITEFALL — Freedom To Fall" />
    <meta property="og:url" content="https://YOUR-SITE-URL/" />
    <link rel="canonical" href="https://YOUR-SITE-URL/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WHITEFALL — Freedom To Fall" />
    <meta name="twitter:description" content="FW26 is coming. Release dates on Instagram, @whitefall26." />
    <meta name="twitter:image" content="https://YOUR-SITE-URL/og-image.png" />
    <!-- Brand identity for search results. Kept on one line so local builds
         (no domain known) drop it cleanly along with the tags above. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Whitefall","url":"https://YOUR-SITE-URL/","logo":"https://YOUR-SITE-URL/logo.png","slogan":"Freedom To Fall","sameAs":["https://instagram.com/whitefall26"]}</script>
    <meta name="theme-color" content="#05070D" />
    <!-- Tab and home-screen icons: the mark on midnight, so it never turns
         into white lines on a white tab bar -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="WHITEFALL" />
    <title>WHITEFALL — Freedom To Fall</title>
    <style>html, body { margin: 0; background: #05070D; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
